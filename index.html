<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quick! Clinical Signs</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: system-ui, sans-serif;
  background: #f8f7f4;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}

.wrap {
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
}

.main-title {
  font-size: 1.4rem;
  font-weight: 800;
  color: #111;
  text-align: center;
}

.progress-wrap { width: 100%; display: flex; align-items: center; gap: 10px; }
.prog-bar { flex: 1; height: 5px; background: #e0ddd6; border-radius: 3px; overflow: hidden; }
.prog-fill { height: 100%; background: #1D9E75; border-radius: 3px; transition: width 0.4s ease; }
.prog-lbl { font-size: 12px; color: #aaa; font-weight: 600; min-width: 36px; text-align: right; }

.q-card {
  width: 100%;
  background: #fff;
  border-radius: 16px;
  border: 1px solid #e0ddd6;
  padding: 1.1rem 1.5rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  position: relative;
  overflow: hidden;
  min-height: 90px;
}
canvas { position: absolute; inset: 0; pointer-events: none; border-radius: 16px; }

.q-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #aaa;
}
.q-display {
  font-size: 1.7rem;
  font-weight: 800;
  color: #111;
  line-height: 1.15;
  text-align: center;
}
.feedback-msg {
  font-size: 13px;
  font-weight: 600;
  color: #aaa;
  min-height: 18px;
  transition: color 0.2s;
  text-align: center;
}
.feedback-msg.ok  { color: #1D9E75; }
.feedback-msg.err { color: #e24b4a; }

.ans-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  width: 100%;
}

.abtn {
  padding: 13px 10px;
  border-radius: 12px;
  border: 1.5px solid #ddd;
  background: #fff;
  font-size: 12.5px;
  font-weight: 600;
  color: #333;
  cursor: pointer;
  text-align: center;
  line-height: 1.3;
  transition: background 0.12s, border-color 0.12s, transform 0.1s, box-shadow 0.12s;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.abtn:hover:not(:disabled) {
  border-color: #aaa;
  transform: translateY(-1px);
}

.abtn.confirmed {
  background: #e1f5ee;
  border-color: #1D9E75;
  color: #0F6E56;
  pointer-events: none;
}

.abtn.wrong-hl {
  background: #fcebeb;
  border-color: #e24b4a;
  color: #a32d2d;
  pointer-events: none;
  animation: shk 0.4s ease;
}

.abtn:disabled { cursor: default; opacity: 0.4; }

@keyframes shk {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

.score { font-size: 13px; color: #999; }
.score b { color: #555; }

.results-card {
  width: 100%;
  background: #fff;
  border-radius: 20px;
  border: 1px solid #e0ddd6;
  padding: 2rem 1.5rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.25rem;
}
.results-card h2 { font-size: 1.5rem; font-weight: 700; color: #111; }
.stat-row { width: 100%; display: flex; gap: 10px; }
.stat-box { flex: 1; background: #f8f7f4; border-radius: 14px; padding: 1rem; text-align: center; }
.stat-box .num { font-size: 2rem; font-weight: 800; color: #111; line-height: 1; margin-bottom: 4px; }
.stat-box .lbl { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #aaa; }
.stat-box.green .num { color: #1D9E75; }
.stat-box.red .num { color: #e24b4a; }
.accuracy-bar-wrap { width: 100%; }
.accuracy-bar-bg { width: 100%; height: 8px; background: #f0ede8; border-radius: 4px; overflow: hidden; }
.accuracy-bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
.accuracy-lbl { display: flex; justify-content: space-between; font-size: 12px; color: #aaa; margin-bottom: 6px; font-weight: 600; }
.remark { font-size: 14px; color: #555; text-align: center; font-weight: 500; }

.missed-wrap { width: 100%; }
.missed-header { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #aaa; margin-bottom: 8px; }
.missed-item { background: #f8f7f4; border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.missed-name { font-size: 13px; font-weight: 700; color: #111; }
.missed-meaning { font-size: 12px; color: #888; font-weight: 500; text-align: right; }

.replay-btn { width: 100%; padding: 13px; background: #111; color: #fff; border: none; border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer; }
.replay-btn:hover { background: #333; }

.logo-footer { margin-top: 0.5rem; }
.logo-footer img { height: 36px; width: auto; display: block; }
</style>
</head>
<body>

<div class="wrap" id="quizView">
  <div class="main-title">Quick! Clinical Signs</div>
  <div class="progress-wrap">
    <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    <div class="prog-lbl" id="progLbl">0 / 18</div>
  </div>
  <div class="q-card" id="qCard">
    <canvas id="cv"></canvas>
    <div class="q-label">What does this sign indicate?</div>
    <div class="q-display" id="qDisplay">—</div>
    <div class="feedback-msg" id="feedbackMsg"></div>
  </div>
  <div class="ans-grid" id="ansGrid"></div>
  <div class="score">Correct: <b id="sc">0</b> &nbsp;/&nbsp; Attempts: <b id="at">0</b></div>
  <div class="logo-footer"><img src="beal_logo_blue_sm.webp" alt="Beal logo"></div>
</div>

<div class="wrap" id="resultsView" style="display:none;">
  <div class="results-card">
    <div style="font-size:2rem;">🩺</div>
    <h2>Round Complete!</h2>
    <div class="stat-row">
      <div class="stat-box green"><div class="num" id="rCorrect">—</div><div class="lbl">First-try correct</div></div>
      <div class="stat-box red"><div class="num" id="rMissed">—</div><div class="lbl">Needed retries</div></div>
      <div class="stat-box"><div class="num" id="rAttempts">—</div><div class="lbl">Total attempts</div></div>
    </div>
    <div class="accuracy-bar-wrap">
      <div class="accuracy-lbl"><span>Accuracy</span><span id="rPct">—</span></div>
      <div class="accuracy-bar-bg"><div class="accuracy-bar-fill" id="rBar" style="width:0%;"></div></div>
    </div>
    <div class="remark" id="rRemark">—</div>
    <div class="missed-wrap" id="missedWrap"></div>
    <button class="replay-btn" onclick="init()">Play Again</button>
  </div>
</div>

<script>
var SIGNS = [
  { name: "Babinski Reflex",   meaning: "Upper motor neuron lesion" },
  { name: "Cushing's Triad",   meaning: "Increased intracranial pressure" },
  { name: "Kernig's Sign",     meaning: "Meningitis" },
  { name: "Brudzinski's Sign", meaning: "Meningitis" },
  { name: "Romberg Test",      meaning: "Cerebellar / proprioception deficit" },
  { name: "Battle's Sign",     meaning: "Basilar skull fracture" },
  { name: "Murphy's Sign",     meaning: "Cholecystitis" },
  { name: "McBurney's Sign",   meaning: "Appendicitis" },
  { name: "Rovsing's Sign",    meaning: "Appendicitis" },
  { name: "Cullen's Sign",     meaning: "Intra-abdominal bleed or pancreatitis" },
  { name: "Beck's Triad",      meaning: "Cardiac tamponade" },
  { name: "Chvostek's Sign",   meaning: "Hypocalcemia" },
  { name: "Trousseau's Sign",  meaning: "Hypocalcemia" },
  { name: "Phalen's Test",     meaning: "Carpal tunnel syndrome" },
  { name: "Tinel's Sign",      meaning: "Carpal tunnel syndrome" },
  { name: "Chadwick's Sign",   meaning: "Early pregnancy" },
  { name: "Goodell's Sign",    meaning: "Early pregnancy" },
  { name: "Hegar's Sign",      meaning: "Early pregnancy" },
];

var deck, idx, sc, at, firstTryCorrect, currentWasWrong, missedSignsList, questionNeedsRetry;
var currentOptions = [];
var particles = [], raf = null;

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function getWrongOptions(correct, count) {
  var pool = SIGNS.filter(function(s) { return s.meaning !== correct; })
                  .map(function(s) { return s.meaning; });
  pool = pool.filter(function(v, i, a) { return a.indexOf(v) === i; });
  return shuffle(pool).slice(0, count);
}

function getBtnId(meaning) {
  return 'abtn-' + meaning.replace(/[^a-zA-Z0-9]/g, '_');
}

function init() {
  deck = shuffle(SIGNS);
  idx = 0; sc = 0; at = 0; firstTryCorrect = 0;
  currentWasWrong = false; missedSignsList = []; questionNeedsRetry = {};
  document.getElementById('quizView').style.display = 'flex';
  document.getElementById('resultsView').style.display = 'none';
  loadQuestion();
  updateScore();
}

function updateProgress() {
  document.getElementById('progFill').style.width = Math.round((idx / deck.length) * 100) + '%';
  document.getElementById('progLbl').textContent = idx + ' / ' + deck.length;
}

function updateScore() {
  document.getElementById('sc').textContent = sc;
  document.getElementById('at').textContent = at;
}

function setFeedback(msg, type) {
  var el = document.getElementById('feedbackMsg');
  el.textContent = msg;
  el.className = 'feedback-msg' + (type ? ' ' + type : '');
}

function loadQuestion() {
  currentWasWrong = false;
  setFeedback('', '');
  updateProgress();

  var q = deck[idx];
  document.getElementById('qDisplay').textContent = q.name;

  var wrongs = getWrongOptions(q.meaning, 3);
  currentOptions = shuffle([q.meaning].concat(wrongs));

  var grid = document.getElementById('ansGrid');
  grid.innerHTML = '';
  currentOptions.forEach(function(opt) {
    var btn = document.createElement('button');
    btn.className = 'abtn';
    btn.id = getBtnId(opt);
    btn.textContent = opt;
    btn.onclick = function() { handleTap(opt, btn); };
    grid.appendChild(btn);
  });
}

function handleTap(chosen, btn) {
  var q = deck[idx];
  if (btn.classList.contains('confirmed') || btn.classList.contains('wrong-hl')) return;

  at++;
  updateScore();

  if (chosen === q.meaning) {
    if (!currentWasWrong) {
      firstTryCorrect++;
      sc++;
    } else {
      sc++;
      if (!questionNeedsRetry[q.name]) {
        questionNeedsRetry[q.name] = true;
        missedSignsList.push(q);
      }
    }

    btn.className = 'abtn confirmed';
    currentOptions.forEach(function(o) {
      var b = document.getElementById(getBtnId(o));
      if (o !== q.meaning) { b.className = 'abtn'; b.disabled = true; }
    });

    setFeedback('Correct! ✓', 'ok');
    updateScore();
    confetti();

    setTimeout(function() {
      stopConfetti();
      idx++;
      if (idx >= deck.length) showResults();
      else loadQuestion();
    }, 1400);

  } else {
    currentWasWrong = true;
    btn.className = 'abtn wrong-hl';
    setFeedback('Not quite — try again!', 'err');
  }
}

function showResults() {
  stopConfetti();
  var missed = deck.length - firstTryCorrect;
  var pct = Math.round((firstTryCorrect / deck.length) * 100);
  var barColor = pct === 100 ? '#1D9E75' : pct >= 75 ? '#378ADD' : pct >= 50 ? '#EF9F27' : '#e24b4a';
  var remarks = [
    [100, 'Perfect — every sign, no hesitation!'],
    [83,  'Really strong — just a couple of slip-ups.'],
    [67,  'Solid round. A few signs to review.'],
    [50,  'Getting there — keep drilling those tricky ones.'],
    [0,   'Lots to learn — another round will help!']
  ];
  var remark = remarks[remarks.length - 1][1];
  for (var i = 0; i < remarks.length; i++) {
    if (pct >= remarks[i][0]) { remark = remarks[i][1]; break; }
  }

  document.getElementById('rCorrect').textContent = firstTryCorrect;
  document.getElementById('rMissed').textContent = missed;
  document.getElementById('rAttempts').textContent = at;
  document.getElementById('rPct').textContent = pct + '%';
  document.getElementById('rBar').style.width = pct + '%';
  document.getElementById('rBar').style.background = barColor;
  document.getElementById('rRemark').textContent = remark;

  var mw = document.getElementById('missedWrap');
  mw.innerHTML = '';
  if (missedSignsList.length > 0) {
    mw.innerHTML = '<div style="height:1px;background:#e0ddd6;margin:0 0 12px;"></div><div class="missed-header">Needed multiple tries (' + missedSignsList.length + ')</div>';
    missedSignsList.forEach(function(s) {
      var d = document.createElement('div');
      d.className = 'missed-item';
      d.innerHTML = '<div class="missed-name">' + s.name + '</div><div class="missed-meaning">' + s.meaning + '</div>';
      mw.appendChild(d);
    });
  }

  document.getElementById('quizView').style.display = 'none';
  document.getElementById('resultsView').style.display = 'flex';
}

function confetti() {
  var cv = document.getElementById('cv'), card = document.getElementById('qCard');
  cv.width = card.offsetWidth; cv.height = card.offsetHeight;
  var ctx = cv.getContext('2d');
  var cols = ['#1D9E75','#5DCAA5','#378ADD','#D4537E','#EF9F27','#7F77DD'];
  particles = [];
  for (var i = 0; i < 70; i++) particles.push({
    x: Math.random() * cv.width, y: -10 - Math.random() * 30,
    w: 6 + Math.random() * 6, h: 7 + Math.random() * 5,
    c: cols[Math.floor(Math.random() * cols.length)],
    vx: (Math.random() - 0.5) * 4, vy: 2 + Math.random() * 3,
    a: Math.random() * Math.PI * 2, spin: (Math.random() - 0.5) * 0.18, alpha: 1
  });
  if (raf) cancelAnimationFrame(raf);
  function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height); var any = false;
    particles.forEach(function(p) {
      p.x += p.vx; p.y += p.vy; p.a += p.spin; p.alpha -= 0.02;
      if (p.alpha > 0) {
        any = true; ctx.save(); ctx.globalAlpha = p.alpha;
        ctx.translate(p.x, p.y); ctx.rotate(p.a);
        ctx.fillStyle = p.c; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
        ctx.restore();
      }
    });
    if (any) raf = requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, cv.width, cv.height);
  }
  draw();
}

function stopConfetti() {
  if (raf) { cancelAnimationFrame(raf); raf = null; }
  var cv = document.getElementById('cv');
  if (cv) cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
}

init();
</script>
</body>
</html>
